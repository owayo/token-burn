# このリポジトリのツールチェーン。ローカル開発（Makefile 経由）と CI の双方で、
# ツールの版はこのファイルを正とする。

[tools]
# profile と components を明示する。省略すると rustup の既定 profile に依存し、
# GitHub Actions の minimal profile には rustfmt / clippy が無いため `make ci` が失敗する。
# minimal に Makefile で使うコンポーネントだけを追加する。
rust = { version = "1.99.1", profile = "minimal", components = ["rustfmt", "clippy"] }

[env]
# Ship the Windows CRT in the executable; the ZIP does not require a separate runtime installer.
CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = "-C target-feature=+crt-static"
