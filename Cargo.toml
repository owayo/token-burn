[package]
name = "token-burn"
version = "26.6.102"
edition = "2024"
description = "CLI tool to consume AI coding assistant tokens before weekly reset"

[[bin]]
name = "token-burn"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
tokio = { version = "1.53.1", features = ["full"] }
colored = "3.1.1"
dirs = "6"
shellexpand = "3.1.2"
anyhow = "1.0.104"
fs2 = "0.4.3"
ratatui = "0.30.2"

[dev-dependencies]
tempfile = "3.27.0"
